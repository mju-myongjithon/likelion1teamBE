<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>띵춘 이메일 인증</title>
</head>
<body style="margin:0; padding:0; background-color:#F3F5FB; font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F3F5FB; padding:40px 16px;">
    <tr>
        <td align="center">

            <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#FFFFFF; border-radius:20px; overflow:hidden; box-shadow:0 2px 12px rgba(30,41,90,0.06);">

                <tr>
                    <td align="center" style="padding:40px 32px 8px 32px;">
                        <img src="cid:logo" alt="띵춘" width="140" style="display:block; max-width:140px; height:auto;">
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 32px 0 32px;">
                        <div style="height:1px; background-color:#EEF0F6;"></div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:36px 32px 8px 32px;" align="center">
                        <p style="margin:0; font-size:15px; color:#8A8FA3; line-height:1.6;">
                            학교 이메일 인증을 요청하셨어요
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 32px 8px 32px;" align="center">
                        <div style="background-color:#F3F5FB; border-radius:14px; padding:24px 20px; width:100%; box-sizing:border-box;">
                            <div style="font-size:34px; font-weight:800; letter-spacing:8px; color:#3A4A8C; font-family:'SF Mono', 'Roboto Mono', monospace;">
                                {{CODE}}
                            </div>
                        </div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:20px 32px 4px 32px;" align="center">
                        <p style="margin:0; font-size:14px; color:#8A8FA3; line-height:1.6;">
                            인증번호는 <strong style="color:#5B7FE7;">5분간</strong> 유효해요.<br>
                            시간이 지나면 인증메일을 다시 요청해주세요.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td style="padding:32px 32px 0 32px;">
                        <div style="height:1px; background-color:#EEF0F6;"></div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:24px 32px 32px 32px;" align="center">
                        <p style="margin:0; font-size:12px; color:#B4B8C6; line-height:1.7;">
                            본인이 요청하지 않았다면 이 메일을 무시해주세요.<br>
                            인문캠 자연캠 소식을 한 곳에서, 캠퍼스 무관 새로운 인연까지 — 띵춘
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
